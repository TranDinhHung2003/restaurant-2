# Deploy trên Render.com (miễn phí) — Quán Nhà
#
# Cách dùng:
# 1. Push code lên GitHub (đã có sẵn repo này)
# 2. Vào https://dashboard.render.com → New → Blueprint
# 3. Chọn repo → Apply
# 4. Điền các biến môi trường (xem README mục Deploy)
# 5. Tạo MongoDB Atlas miễn phí, dán MONGO_URI vào Render

services:
  - type: web
    name: quan-nha
    runtime: node
    rootDir: restaurant-app/server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: MONGO_URI
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BANK_BIN
        sync: false
      - key: BANK_ACCOUNT_NO
        sync: false
      - key: BANK_ACCOUNT_NAME
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
