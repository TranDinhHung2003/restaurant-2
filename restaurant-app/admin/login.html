<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập quản trị — Quán Nhà</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <form class="login-card" id="loginForm">
    <p class="login-card__mark">QN</p>
    <h1 class="login-card__title">Quản trị Quán Nhà</h1>
    <p class="login-card__sub">Đăng nhập để xem đơn hàng &amp; quản lý thực đơn</p>

    <label class="field">
      <span>Tài khoản</span>
      <input type="text" name="username" required autocomplete="username">
    </label>
    <label class="field">
      <span>Mật khẩu</span>
      <input type="password" name="password" required autocomplete="current-password">
    </label>

    <p class="login-card__error" id="loginError" hidden></p>
    <button class="btn btn--primary btn--block" type="submit">Đăng nhập</button>
  </form>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
